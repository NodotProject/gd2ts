name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5"
  SCONS_CACHE_LIMIT: 7168

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux (x86_64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-gdscript submodule
        run: git submodule update --init --recursive tree-sitter-gdscript

      - name: Setup GDExtension Build Environment
        uses: NodotProject/godot-cpp-builds@v1
        with:
          godot-version: '4.5-stable'
          godot-cpp-path: './godot-cpp'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config

      - name: Setup SCons cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons-cache/
          key: ${{ runner.os }}-scons-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Build GDExtension (Debug)
        run: |
          scons platform=linux target=template_debug -j$(nproc)

      - name: Build GDExtension (Release)
        run: |
          scons platform=linux target=template_release -j$(nproc)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd2ts-linux-x86_64
          path: addons/gd2ts/bin/linux.*/*
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    name: Build Windows (x86_64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-gdscript submodule
        run: git submodule update --init --recursive tree-sitter-gdscript

      - name: Setup GDExtension Build Environment
        uses: NodotProject/godot-cpp-builds@v1
        with:
          godot-version: '4.5-stable'
          godot-cpp-path: './godot-cpp'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup SCons cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons-cache/
          key: ${{ runner.os }}-scons-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Build GDExtension (Debug)
        run: |
          scons platform=windows target=template_debug

      - name: Build GDExtension (Release)
        run: |
          scons platform=windows target=template_release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd2ts-windows-x86_64
          path: addons/gd2ts/bin/windows.*/*
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    name: Build macOS (Universal)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tree-sitter-gdscript submodule
        run: git submodule update --init --recursive tree-sitter-gdscript

      - name: Setup GDExtension Build Environment
        uses: NodotProject/godot-cpp-builds@v1
        with:
          godot-version: '4.5-stable'
          godot-cpp-path: './godot-cpp'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          brew install scons

      - name: Setup SCons cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.scons-cache/
          key: ${{ runner.os }}-scons-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Build GDExtension (Debug x86_64)
        run: |
          scons platform=macos target=template_debug arch=x86_64

      - name: Build GDExtension (Debug arm64)
        run: |
          scons platform=macos target=template_debug arch=arm64

      - name: Build GDExtension (Release x86_64)
        run: |
          scons platform=macos target=template_release arch=x86_64

      - name: Build GDExtension (Release arm64)
        run: |
          scons platform=macos target=template_release arch=arm64

      - name: Create universal binaries (Debug)
        run: |
          mkdir -p addons/gd2ts/bin/macos.debug
          lipo -create \
            addons/gd2ts/bin/macos.debug/libgd2ts.x86_64.dylib \
            addons/gd2ts/bin/macos.debug/libgd2ts.arm64.dylib \
            -output addons/gd2ts/bin/macos.debug/libgd2ts.dylib

      - name: Create universal binaries (Release)
        run: |
          mkdir -p addons/gd2ts/bin/macos.release
          lipo -create \
            addons/gd2ts/bin/macos.release/libgd2ts.x86_64.dylib \
            addons/gd2ts/bin/macos.release/libgd2ts.arm64.dylib \
            -output addons/gd2ts/bin/macos.release/libgd2ts.dylib

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gd2ts-macos-universal
          path: addons/gd2ts/bin/macos.*/*
          retention-days: 7

  create-addon-package:
    runs-on: ubuntu-latest
    name: Create addon package
    needs: [build-linux, build-windows, build-macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create addons directory
        run: mkdir -p package/addons/gd2ts/bin

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: gd2ts-linux-x86_64
          path: package/addons/gd2ts/bin/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: gd2ts-windows-x86_64
          path: package/addons/gd2ts/bin/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gd2ts-macos-universal
          path: package/addons/gd2ts/bin/

      - name: Copy gdextension file
        run: |
          cp addons/gd2ts/gd2ts.gdextension package/addons/gd2ts/

      - name: Copy config directory
        run: |
          cp -r addons/gd2ts/config package/addons/gd2ts/

      - name: Copy README and LICENSE
        run: |
          cp README.md package/addons/gd2ts/
          cp LICENSE package/addons/gd2ts/ || echo "LICENSE file not found"

      - name: Generate SHA256 checksums
        run: |
          cd package/addons/gd2ts/bin
          find . -type f -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create addon archive
        run: |
          cd package
          zip -r ../gd2ts-addon.zip addons/

      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: gd2ts-addon
          path: gd2ts-addon.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [create-addon-package]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download addon package
        uses: actions/download-artifact@v4
        with:
          name: gd2ts-addon
          path: .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: gd2ts-addon.zip
          name: gd2ts-${{ github.ref_name }}
